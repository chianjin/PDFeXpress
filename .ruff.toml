target-version = "py313"
line-length = 108

include = [
    "build.py",
    "src/**/*.py",
    "src/**/*.pyi",
]

[lint]
select = [
    "E", # pycodestyle Error
    "W", # pycodestyle Warning
    "F", # Pyflakes
    "I", # isort
    "B", # bugbear
    "UP", # pyupgrade
    "TID", # flake8-tidy-imports
    "PL", # pylint
]

ignore = [
    "PLW2901", # `for` loop variable overwritten by assignment target
    "B008", # Do not use mutable default arguments
    "PLC0415", # import-outside-top-level（frame 内懒加载 worker 是项目架构）
    "PLR2004", # magic-value-comparison（魔数）
    "PLR0911", # too-many-return-statements（既有复杂度，不重构）
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR0917", # too-many-positional-arguments
]

exclude = [
    ".git",
    "__pycache__",
    "src/data",
    "src/locale",
]

[format]
quote-style = "single"
