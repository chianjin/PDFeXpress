# Internationalization (i18n) - Babel
#
# Babel replaces GNU xgettext: its AST-based parser extracts gettext
# calls (e.g. _("PageNum")) even when nested inside f-strings, which
# xgettext cannot do.
#
# Usage (run from the repository root). The catalog domain is
# "pdfexpress" (see src/config.EXECUTABLE_NAME), so -D pdfexpress is
# required for update/compile.
#
#   1) Regenerate the template (POT) from source strings:
#        pybabel extract -F babel.cfg \
#          --project "PDF eXpress" --version 2.0 \
#          --copyright-holder "Chian Jin" \
#          --msgid-bugs-address chian.jin@gmail.com \
#          -o src/locale/pdfexpress.pot src
#
#   2) Merge new strings into existing translations (PO):
#        pybabel update -i src/locale/pdfexpress.pot -d src/locale -D pdfexpress
#
#   3) Compile PO -> MO (what the running app loads):
#        pybabel compile -d src/locale -D pdfexpress
#
# Note: compile skips a catalog whose header carries the "#, fuzzy"
# flag. Remove that flag from src/locale/zh_CN/LC_MESSAGES/pdfexpress.po
# (and run step 1 first) so a fresh .mo is emitted.

[python: **.py]
