[project]
name = "pdfexpress"
version = "2.0"
description = "跨平台 PDF 工具箱：合并、拆分、压缩、加密、提取文本/图片、添加水印与页码等（基于 Tkinter + PyMuPDF）"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ email = "chian.jin@gmail.com" }]
dependencies = [
    "pillow==12.3.0",
    "pymupdf==1.28.2",
    "tkinterdnd2==0.6.2",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==6.22.1",
]

[project.urls]
Homepage = "https://github.com/chianjin/PDFeXpress"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# i18n: extract translatable strings with Babel (replaces GNU xgettext).
# Babel uses an AST-based parser, so it correctly extracts gettext calls
# (e.g. _("PageNum")) even when they are nested inside f-strings, which
# xgettext cannot do.
# Regenerate the template with (run from inside src/ so location
# comments stay relative, matching the existing .po):
#   cd src && pybabel extract -F ../pyproject.toml -o locale/pdfexpress.pot .
[tool.babel]
[[tool.babel.mappings]]
pattern = "**.py"
method = "python"
